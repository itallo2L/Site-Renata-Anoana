<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Painel — Renata Anoana</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#FEF6F4;
    --surface:#F9E7E4;
    --surface-raised:#FAE2EA;
    --border:#E9C9CC;
    --primary:#E88D94;
    --primary-hover:#D97F88;
    --on-primary:#1C1617;
    --accent:#BE3543;
    --on-accent:#FFFFFF;
    --text-title:#1C1617;
    --text:#555150;
    --text-muted:#6F666B;
    --danger:#B23A3A;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  h1,h2,h3{
    font-family:'Cormorant Garamond',Georgia,serif;
    color:var(--text-title);
    margin:0 0 4px;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 80px;}
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;border-bottom:1px solid var(--border);background:#fff;
  }
  header.topbar h1{font-size:22px;}
  .btn{
    font-family:inherit;font-size:14px;font-weight:600;
    border:none;border-radius:var(--radius);padding:10px 18px;
    cursor:pointer;transition:background .15s ease;
  }
  .btn.primary{background:var(--primary);color:var(--on-primary);}
  .btn.primary:hover{background:var(--primary-hover);}
  .btn.outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn.outline:hover{background:var(--surface);}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.danger:hover{background:#962f2f;}
  .btn:disabled{opacity:.6;cursor:not-allowed;}

  #login-view{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
  }
  .login-card{
    background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:36px 32px;width:100%;max-width:360px;box-shadow:0 10px 28px -16px rgba(28,22,23,.24);
  }
  .login-card h1{font-size:26px;margin-bottom:6px;}
  .login-card p{color:var(--text-muted);font-size:14px;margin:0 0 20px;}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-title);}
  input,select,textarea{
    width:100%;font-family:inherit;font-size:14px;padding:10px 12px;
    border:1px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--text-title);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .field{margin-bottom:14px;}
  .error-msg{color:var(--danger);font-size:13px;margin:8px 0 0;min-height:16px;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .toolbar .count{color:var(--text-muted);font-size:13px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .card{
    background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;
    display:flex;flex-direction:column;
  }
  .card .thumb{width:100%;aspect-ratio:1;background:var(--surface) center/cover no-repeat;}
  .card .body{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:4px;}
  .card .title{font-weight:600;color:var(--text-title);font-size:15px;}
  .card .meta{font-size:12px;color:var(--text-muted);}
  .card .price{font-weight:700;color:var(--accent);font-size:14px;}
  .card .actions{display:flex;gap:8px;padding:0 14px 14px;}
  .card .actions .btn{flex:1;padding:8px;font-size:13px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(28,22,23,.45);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal{
    background:#fff;border-radius:12px;max-width:520px;width:100%;
    max-height:90vh;overflow-y:auto;padding:28px;
  }
  .modal h2{font-size:22px;margin-bottom:18px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .hint{font-size:12px;color:var(--text-muted);margin-top:4px;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--text-title);color:#fff;
    padding:12px 18px;border-radius:8px;font-size:14px;box-shadow:0 10px 28px -16px rgba(0,0,0,.4);
    z-index:100;
  }
  .toast.error{background:var(--danger);}
  [hidden]{display:none !important;}
</style>
</head>
<body>

<div id="login-view">
  <form class="login-card" id="login-form">
    <h1>Painel Renata Anoana</h1>
    <p>Entre com a senha para gerenciar o catálogo.</p>
    <div class="field">
      <label for="login-password">Senha</label>
      <input type="password" id="login-password" autocomplete="current-password" required />
    </div>
    <button class="btn primary" type="submit" style="width:100%">Entrar</button>
    <p class="error-msg" id="login-error"></p>
  </form>
</div>

<div id="app-view" hidden>
  <header class="topbar">
    <h1>Catálogo</h1>
    <div style="display:flex;gap:10px;">
      <button class="btn primary" id="btn-new-product">+ Novo produto</button>
      <button class="btn outline" id="btn-logout">Sair</button>
    </div>
  </header>

  <div class="wrap">
    <div class="toolbar">
      <span class="count" id="product-count"></span>
    </div>
    <div class="grid" id="product-grid"></div>
    <div class="empty-state" id="empty-state" hidden>Nenhum produto cadastrado ainda.</div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal">
    <h2 id="modal-title">Novo produto</h2>
    <form id="product-form">
      <div class="field">
        <label for="f-title">Título *</label>
        <input id="f-title" required />
      </div>
      <div class="field">
        <label for="f-description">Descrição</label>
        <textarea id="f-description" rows="2"></textarea>
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-category">Categoria</label>
          <select id="f-category">
            <option value="brincos">Brincos</option>
            <option value="aneis">Anéis</option>
            <option value="pulseiras">Pulseiras</option>
            <option value="braceletes">Braceletes</option>
            <option value="conjuntos">Conjuntos</option>
          </select>
        </div>
        <div class="field">
          <label for="f-material">Material</label>
          <select id="f-material">
            <option value="Prata 925">Prata 925</option>
            <option value="Prata Turca">Prata Turca</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-price">Preço (R$)</label>
          <input id="f-price" type="number" min="0" step="0.01" placeholder="Opcional" />
        </div>
        <div class="field">
          <label for="f-size">Tamanho</label>
          <input id="f-size" placeholder="Opcional" />
        </div>
      </div>
      <div class="field">
        <label for="f-image">Foto do produto</label>
        <input id="f-image" type="file" accept="image/*" />
        <p class="hint" id="current-image-hint"></p>
      </div>
      <p class="error-msg" id="form-error"></p>
      <div class="modal-actions">
        <button type="button" class="btn outline" id="btn-cancel">Cancelar</button>
        <button type="submit" class="btn primary" id="btn-save">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  var API_BASE = (function () {
    var host = window.location.hostname;
    if (host === 'renataanoana.com.br' || host === 'www.renataanoana.com.br') {
      return 'https://api.renataanoana.com.br';
    }
    return ''; // mesmo domínio (dev local, previews etc.)
  })();

  var state = { products: [], editingId: null };

  var loginView = document.getElementById('login-view');
  var appView = document.getElementById('app-view');
  var loginForm = document.getElementById('login-form');
  var loginError = document.getElementById('login-error');
  var grid = document.getElementById('product-grid');
  var emptyState = document.getElementById('empty-state');
  var productCount = document.getElementById('product-count');
  var modalOverlay = document.getElementById('modal-overlay');
  var modalTitle = document.getElementById('modal-title');
  var productForm = document.getElementById('product-form');
  var formError = document.getElementById('form-error');
  var currentImageHint = document.getElementById('current-image-hint');

  function showToast(message, isError) {
    var toast = document.createElement('div');
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 3500);
  }

  function fileToDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function api(path, options) {
    var res = await fetch(API_BASE + path, Object.assign({
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
    }, options || {}));
    var data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      throw new Error((data && data.error) || ('Erro ' + res.status));
    }
    return data;
  }

  function renderProducts() {
    grid.innerHTML = '';
    productCount.textContent = state.products.length + ' produto(s)';
    emptyState.hidden = state.products.length > 0;

    state.products.forEach(function (product) {
      var card = document.createElement('div');
      card.className = 'card';

      var thumb = document.createElement('div');
      thumb.className = 'thumb';
      if (product.image) thumb.style.backgroundImage = 'url(' + product.image + ')';
      card.appendChild(thumb);

      var body = document.createElement('div');
      body.className = 'body';
      body.innerHTML =
        '<div class="title">' + escapeHtml(product.title) + '</div>' +
        '<div class="meta">' + escapeHtml(product.category || '') + ' · ' + escapeHtml(product.material || '') + '</div>' +
        '<div class="price">' + (product.price != null ? 'R$ ' + Number(product.price).toFixed(2) : 'Sem preço') + '</div>';
      card.appendChild(body);

      var actions = document.createElement('div');
      actions.className = 'actions';

      var editBtn = document.createElement('button');
      editBtn.className = 'btn outline';
      editBtn.textContent = 'Editar';
      editBtn.onclick = function () { openModal(product); };
      actions.appendChild(editBtn);

      var delBtn = document.createElement('button');
      delBtn.className = 'btn danger';
      delBtn.textContent = 'Excluir';
      delBtn.onclick = function () { deleteProduct(product); };
      actions.appendChild(delBtn);

      card.appendChild(actions);
      grid.appendChild(card);
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  async function loadProducts() {
    state.products = await api('/api/products');
    renderProducts();
  }

  function openModal(product) {
    formError.textContent = '';
    productForm.reset();
    state.editingId = product ? product.id : null;
    modalTitle.textContent = product ? 'Editar produto' : 'Novo produto';

    document.getElementById('f-title').value = product ? product.title : '';
    document.getElementById('f-description').value = product ? product.description || '' : '';
    document.getElementById('f-category').value = product ? product.category || 'brincos' : 'brincos';
    document.getElementById('f-material').value = product ? product.material || 'Prata 925' : 'Prata 925';
    document.getElementById('f-price').value = product && product.price != null ? product.price : '';
    document.getElementById('f-size').value = product && product.size ? product.size : '';
    currentImageHint.textContent = product && product.image ? 'Imagem atual: ' + product.image : '';

    modalOverlay.hidden = false;
  }

  function closeModal() {
    modalOverlay.hidden = true;
    state.editingId = null;
  }

  async function deleteProduct(product) {
    if (!confirm('Excluir "' + product.title + '"? Essa ação não pode ser desfeita.')) return;
    try {
      await api('/api/products?id=' + encodeURIComponent(product.id), { method: 'DELETE' });
      showToast('Produto excluído');
      await loadProducts();
    } catch (err) {
      showToast(err.message, true);
    }
  }

  productForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    formError.textContent = '';
    var saveBtn = document.getElementById('btn-save');
    saveBtn.disabled = true;

    try {
      var priceValue = document.getElementById('f-price').value;
      var payload = {
        product: {
          title: document.getElementById('f-title').value.trim(),
          description: document.getElementById('f-description').value.trim(),
          category: document.getElementById('f-category').value,
          material: document.getElementById('f-material').value,
          price: priceValue === '' ? null : Number(priceValue),
          size: document.getElementById('f-size').value.trim() || null,
        },
      };

      var fileInput = document.getElementById('f-image');
      if (fileInput.files && fileInput.files[0]) {
        payload.image = await fileToDataUrl(fileInput.files[0]);
      }

      if (state.editingId) {
        await api('/api/products?id=' + encodeURIComponent(state.editingId), {
          method: 'PUT',
          body: JSON.stringify(payload),
        });
        showToast('Produto atualizado');
      } else {
        await api('/api/products', {
          method: 'POST',
          body: JSON.stringify(payload),
        });
        showToast('Produto criado');
      }

      closeModal();
      await loadProducts();
    } catch (err) {
      formError.textContent = err.message;
    } finally {
      saveBtn.disabled = false;
    }
  });

  document.getElementById('btn-new-product').onclick = function () { openModal(null); };
  document.getElementById('btn-cancel').onclick = closeModal;
  modalOverlay.addEventListener('click', function (e) {
    if (e.target === modalOverlay) closeModal();
  });

  document.getElementById('btn-logout').onclick = async function () {
    await api('/api/logout', { method: 'POST' });
    showLogin();
  };

  loginForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    loginError.textContent = '';
    try {
      await api('/api/login', {
        method: 'POST',
        body: JSON.stringify({ password: document.getElementById('login-password').value }),
      });
      await showApp();
    } catch (err) {
      loginError.textContent = err.message;
    }
  });

  function showLogin() {
    appView.hidden = true;
    loginView.hidden = false;
    document.getElementById('login-password').value = '';
  }

  async function showApp() {
    loginView.hidden = true;
    appView.hidden = false;
    await loadProducts();
  }

  (async function init() {
    try {
      var session = await api('/api/session');
      if (session.authenticated) {
        await showApp();
        return;
      }
    } catch (e) {}
    showLogin();
  })();
})();
</script>
</body>
</html>
