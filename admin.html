<title>Painel — Renata Anoana</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#FEF6F4;
    --surface:#F9E7E4;
    --surface-raised:#FAE2EA;
    --border:#E9C9CC;
    --primary:#E88D94;
    --primary-hover:#D97F88;
    --on-primary:#1C1617;
    --accent:#BE3543;
    --on-accent:#FFFFFF;
    --text-title:#1C1617;
    --text:#555150;
    --text-muted:#6F666B;
    --danger:#B23A3A;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  h1,h2,h3{
    font-family:'Cormorant Garamond',Georgia,serif;
    color:var(--text-title);
    margin:0 0 4px;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 80px;}
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;border-bottom:1px solid var(--border);background:#fff;
  }
  header.topbar h1{font-size:22px;}
  .btn{
    font-family:inherit;font-size:14px;font-weight:600;
    border:none;border-radius:var(--radius);padding:10px 18px;
    cursor:pointer;transition:background .15s ease;
  }
  .btn.primary{background:var(--primary);color:var(--on-primary);}
  .btn.primary:hover{background:var(--primary-hover);}
  .btn.outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn.outline:hover{background:var(--surface);}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.danger:hover{background:#962f2f;}
  .btn:disabled{opacity:.6;cursor:not-allowed;}

  #login-view,#boot-view{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
  }
  .login-card{
    background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:36px 32px;width:100%;max-width:360px;box-shadow:0 10px 28px -16px rgba(28,22,23,.24);
  }
  .login-card h1{font-size:26px;margin-bottom:6px;}
  .login-card p{color:var(--text-muted);font-size:14px;margin:0 0 20px;}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-title);}
  input,select,textarea{
    width:100%;font-family:inherit;font-size:14px;padding:10px 12px;
    border:1px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--text-title);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .field{margin-bottom:14px;}
  .error-msg{color:var(--danger);font-size:13px;margin:8px 0 0;min-height:16px;}

  .toolbar{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin-bottom:18px;}
  .toolbar .count{color:var(--text-muted);font-size:13px;margin-left:auto;white-space:nowrap;}
  .toolbar .search-input{width:auto;flex:1;min-width:180px;max-width:280px;}
  .toolbar select{width:auto;padding:9px 10px;font-size:13px;}
  .toolbar .filter-checkbox{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;color:var(--text);white-space:nowrap;
  }
  .toolbar .filter-checkbox input{width:auto;}
  .toolbar .btn{padding:9px 12px;font-size:13px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .card{
    background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;
    display:flex;flex-direction:column;
  }
  .card .thumb{width:100%;aspect-ratio:1;background:var(--surface) center/cover no-repeat;position:relative;}
  .card .thumb-note{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--text-muted);text-align:center;padding:0 8px;
  }
  .card .body{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:4px;}
  .card .title{font-weight:600;color:var(--text-title);font-size:15px;}
  .card .meta{font-size:12px;color:var(--text-muted);}
  .card .price{font-weight:700;color:var(--accent);font-size:14px;}
  .card .actions{display:flex;gap:8px;padding:0 14px 14px;}
  .card .actions .btn{flex:1;padding:8px;font-size:13px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(28,22,23,.45);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal{
    background:#fff;border-radius:12px;max-width:520px;width:100%;
    max-height:90vh;overflow-y:auto;padding:28px;
  }
  .modal h2{font-size:22px;margin-bottom:18px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .hint{font-size:12px;color:var(--text-muted);margin-top:4px;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
  .category-row{
    display:flex;align-items:center;gap:10px;padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .category-row:last-child{border-bottom:none;}
  .category-row .name{font-weight:600;flex:1;}
  .category-row .count{color:var(--text-muted);font-size:12px;}
  .category-row .reassign{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap;}
  .category-row .reassign select{width:auto;flex:1;min-width:140px;}
  .grid-status{
    grid-column:1/-1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:60px 20px;text-align:center;
  }
  .grid-status p{margin:0;color:var(--text-muted);font-size:.9rem;}
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:3px solid var(--border);border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .btn-spinner{
    display:inline-block;width:14px;height:14px;border-radius:50%;
    border:2px solid rgba(255,255,255,.5);border-top-color:#fff;
    animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px;
  }
  .btn.outline .btn-spinner{
    border-color:rgba(28,22,23,.25);border-top-color:var(--text-title);
  }
  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--text-title);color:#fff;
    padding:12px 18px;border-radius:8px;font-size:14px;box-shadow:0 10px 28px -16px rgba(0,0,0,.4);
    z-index:100;
  }
  .toast.error{background:var(--danger);}
  [hidden]{display:none !important;}
</style>
</head>
<body>

<div id="boot-view">
  <span class="spinner" aria-hidden="true"></span>
</div>

<div id="login-view" hidden>
  <form class="login-card" id="login-form">
    <h1>Painel Renata Anoana</h1>
    <p>Entre com a senha para gerenciar o catálogo.</p>
    <div class="field">
      <label for="login-password">Senha</label>
      <input type="password" id="login-password" autocomplete="current-password" required />
    </div>
    <button class="btn primary" type="submit" id="btn-login" style="width:100%">
      <span class="btn-spinner" id="login-spinner" hidden aria-hidden="true"></span>
      <span id="login-btn-label">Entrar</span>
    </button>
    <p class="error-msg" id="login-error"></p>
  </form>
</div>

<div id="app-view" hidden>
  <header class="topbar">
    <h1>Catálogo</h1>
    <div style="display:flex;gap:10px;">
      <button class="btn primary" id="btn-new-product">+ Novo produto</button>
      <button class="btn outline" id="btn-logout">
        <span class="btn-spinner" id="logout-spinner" hidden aria-hidden="true"></span>
        <span id="logout-btn-label">Sair</span>
      </button>
    </div>
  </header>

  <div class="wrap">
    <div class="toolbar">
      <input type="search" id="search-input" class="search-input" placeholder="Buscar por nome..." />
      <select id="filter-category">
        <option value="">Todas as categorias</option>
      </select>
      <select id="filter-material">
        <option value="">Todos os materiais</option>
        <option value="Prata 925">Prata 925</option>
        <option value="Prata Turca">Prata Turca</option>
      </select>
      <select id="filter-sort">
        <option value="recent">Mais recentes</option>
        <option value="name">Nome (A-Z)</option>
        <option value="price-asc">Preço (menor-maior)</option>
        <option value="price-desc">Preço (maior-menor)</option>
      </select>
      <label class="filter-checkbox"><input type="checkbox" id="filter-no-price" /> Sem preço</label>
      <label class="filter-checkbox"><input type="checkbox" id="filter-no-photo" /> Sem foto</label>
      <button class="btn outline" type="button" id="btn-clear-filters">Limpar filtros</button>
      <button class="btn outline" type="button" id="btn-manage-categories">Gerenciar categorias</button>
      <span class="count" id="product-count"></span>
    </div>
    <div class="grid" id="product-grid"></div>
    <div class="empty-state" id="empty-state" hidden></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal">
    <h2 id="modal-title">Novo produto</h2>
    <form id="product-form">
      <div class="field">
        <label for="f-title">Título *</label>
        <input id="f-title" required />
      </div>
      <div class="field">
        <label for="f-description">Descrição</label>
        <textarea id="f-description" rows="2"></textarea>
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-category">Categoria *</label>
          <input id="f-category" list="category-list" required placeholder="Digite para criar ou escolher" />
          <datalist id="category-list"></datalist>
        </div>
        <div class="field">
          <label for="f-material">Material</label>
          <select id="f-material">
            <option value="Prata 925">Prata 925</option>
            <option value="Prata Turca">Prata Turca</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-price">Preço (R$)</label>
          <input id="f-price" type="text" inputmode="numeric" placeholder="Opcional" />
        </div>
        <div class="field">
          <label for="f-size">Tamanho</label>
          <input id="f-size" placeholder="Opcional" />
        </div>
      </div>
      <div class="field">
        <label for="f-image">Foto do produto</label>
        <input id="f-image" type="file" accept="image/*" />
        <p class="hint" id="current-image-hint"></p>
      </div>
      <p class="error-msg" id="form-error"></p>
      <div class="modal-actions">
        <button type="button" class="btn outline" id="btn-cancel">Cancelar</button>
        <button type="submit" class="btn primary" id="btn-save">Salvar</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="categories-overlay" hidden>
  <div class="modal" style="max-width:460px;">
    <h2>Gerenciar categorias</h2>
    <p class="hint" style="margin:-4px 0 14px;">Excluir uma categoria pede pra mover os produtos dela pra outra antes.</p>
    <div id="categories-list"></div>
    <div class="modal-actions">
      <button type="button" class="btn outline" id="btn-categories-close">Fechar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirm-overlay" hidden>
  <div class="modal" style="max-width:380px;">
    <h2>Excluir produto</h2>
    <p id="confirm-message" style="margin:0 0 4px;"></p>
    <p class="hint">Essa ação não pode ser desfeita.</p>
    <div class="modal-actions">
      <button type="button" class="btn outline" id="btn-confirm-cancel">Cancelar</button>
      <button type="button" class="btn danger" id="btn-confirm-delete">Excluir</button>
    </div>
  </div>
</div>

<script>
(function () {
  var API_BASE = (function () {
    var host = window.location.hostname;
    if (host === 'renataanoana.com.br' || host === 'www.renataanoana.com.br') {
      return 'https://api.renataanoana.com.br';
    }
    if (host === 'localhost' || host === '127.0.0.1') {
      return 'http://localhost:3000'; // vercel dev
    }
    return ''; // mesmo domínio (previews etc.)
  })();

  var state = {
    products: [], editingId: null,
    search: '', category: '', material: '', sort: 'recent', noPrice: false, noPhoto: false,
  };

  // Rótulos conhecidos para categorias (mesmo mapa do index.html); qualquer
  // categoria nova que não esteja aqui usa a primeira letra maiúscula como
  // rótulo padrão (ver categoryLabel).
  var CATEGORY_LABELS = {
    colares: 'Colares', aneis: 'Anéis', pulseiras: 'Pulseiras',
    braceletes: 'Braceletes', brincos: 'Brincos', conjuntos: 'Conjuntos',
    pingentes: 'Pingentes',
  };

  function categoryLabel(slug) {
    if (!slug) return '';
    if (CATEGORY_LABELS[slug]) return CATEGORY_LABELS[slug];
    return slug.split('-').map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
  }

  // Converte o texto digitado pelo usuário no slug usado como valor da
  // categoria (sem acento, minúsculo, espaços viram hífen), pra ficar no
  // mesmo padrão das categorias existentes.
  function slugify(text) {
    return String(text || '')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  // Categorias já conhecidas (mapa acima) + qualquer categoria nova criada
  // ao digitar um texto diferente no campo do formulário.
  function getKnownCategorySlugs() {
    var set = {};
    Object.keys(CATEGORY_LABELS).forEach(function (s) { set[s] = true; });
    state.products.forEach(function (p) { if (p.category) set[p.category] = true; });
    return Object.keys(set).sort(function (a, b) {
      return categoryLabel(a).localeCompare(categoryLabel(b), 'pt-BR');
    });
  }

  function populateCategoryOptions() {
    var slugs = getKnownCategorySlugs();

    var previousValue = filterCategory.value;
    filterCategory.innerHTML = '<option value="">Todas as categorias</option>' +
      slugs.map(function (s) {
        return '<option value="' + escapeHtml(s) + '">' + escapeHtml(categoryLabel(s)) + '</option>';
      }).join('');
    filterCategory.value = slugs.indexOf(previousValue) !== -1 ? previousValue : '';

    document.getElementById('category-list').innerHTML = slugs.map(function (s) {
      return '<option value="' + escapeHtml(categoryLabel(s)) + '"></option>';
    }).join('');
  }

  function getCategoryCounts() {
    var counts = {};
    state.products.forEach(function (p) {
      if (p.category) counts[p.category] = (counts[p.category] || 0) + 1;
    });
    return counts;
  }

  function renderCategoriesManager() {
    var counts = getCategoryCounts();
    var slugs = Object.keys(counts).sort(function (a, b) {
      return categoryLabel(a).localeCompare(categoryLabel(b), 'pt-BR');
    });
    var list = document.getElementById('categories-list');

    if (!slugs.length) {
      list.innerHTML = '<p class="hint">Nenhuma categoria em uso ainda.</p>';
      return;
    }

    list.innerHTML = slugs.map(function (slug) {
      return '<div class="category-row" data-slug="' + escapeHtml(slug) + '">' +
        '<span class="name">' + escapeHtml(categoryLabel(slug)) + '</span>' +
        '<span class="count">' + counts[slug] + ' produto(s)</span>' +
        '<button type="button" class="btn danger" data-action="delete-category">Excluir</button>' +
        '</div>';
    }).join('');

    list.querySelectorAll('[data-action="delete-category"]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        startCategoryReassign(btn.closest('.category-row'));
      });
    });
  }

  function startCategoryReassign(row) {
    var slug = row.getAttribute('data-slug');
    var counts = getCategoryCounts();
    var others = Object.keys(counts).filter(function (s) { return s !== slug; });

    if (!others.length) {
      row.innerHTML = '<div class="reassign">' +
        '<span>Crie outra categoria em um produto antes de excluir a última.</span>' +
        '<button type="button" class="btn outline" data-action="cancel-reassign">Voltar</button>' +
        '</div>';
      row.querySelector('[data-action="cancel-reassign"]').addEventListener('click', renderCategoriesManager);
      return;
    }

    var options = others.sort(function (a, b) {
      return categoryLabel(a).localeCompare(categoryLabel(b), 'pt-BR');
    }).map(function (s) {
      return '<option value="' + escapeHtml(s) + '">' + escapeHtml(categoryLabel(s)) + '</option>';
    }).join('');

    row.innerHTML = '<div class="reassign">' +
      '<span>Mover ' + counts[slug] + ' produto(s) de "' + escapeHtml(categoryLabel(slug)) + '" para:</span>' +
      '<select class="reassign-target">' + options + '</select>' +
      '<button type="button" class="btn outline" data-action="cancel-reassign">Cancelar</button>' +
      '<button type="button" class="btn danger" data-action="confirm-reassign">Confirmar</button>' +
      '</div>';

    row.querySelector('[data-action="cancel-reassign"]').addEventListener('click', renderCategoriesManager);
    row.querySelector('[data-action="confirm-reassign"]').addEventListener('click', function () {
      var target = row.querySelector('.reassign-target').value;
      deleteCategory(slug, target, row);
    });
  }

  async function deleteCategory(oldSlug, newSlug, row) {
    row.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    var affected = state.products.filter(function (p) { return p.category === oldSlug; });
    try {
      for (var i = 0; i < affected.length; i++) {
        await api('/api/products?id=' + encodeURIComponent(affected[i].id), {
          method: 'PUT',
          body: JSON.stringify({ product: { category: newSlug } }),
        });
      }
      showToast('Categoria excluída, ' + affected.length + ' produto(s) movido(s) para "' + categoryLabel(newSlug) + '"');
      await loadProducts();
      renderCategoriesManager();
    } catch (err) {
      showToast(err.message, true);
      row.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
    }
  }

  var bootView = document.getElementById('boot-view');
  var loginView = document.getElementById('login-view');
  var appView = document.getElementById('app-view');
  var loginForm = document.getElementById('login-form');
  var loginError = document.getElementById('login-error');
  var grid = document.getElementById('product-grid');
  var emptyState = document.getElementById('empty-state');
  var productCount = document.getElementById('product-count');
  var searchInput = document.getElementById('search-input');
  var filterCategory = document.getElementById('filter-category');
  var filterMaterial = document.getElementById('filter-material');
  var filterSort = document.getElementById('filter-sort');
  var filterNoPrice = document.getElementById('filter-no-price');
  var filterNoPhoto = document.getElementById('filter-no-photo');
  var btnClearFilters = document.getElementById('btn-clear-filters');
  var modalOverlay = document.getElementById('modal-overlay');
  var modalTitle = document.getElementById('modal-title');
  var productForm = document.getElementById('product-form');
  var formError = document.getElementById('form-error');
  var currentImageHint = document.getElementById('current-image-hint');

  function showToast(message, isError) {
    var toast = document.createElement('div');
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 3500);
  }

  // Máscara de preço estilo "digitação da direita pra esquerda": cada
  // dígito novo entra como centavo e empurra o resto pra esquerda (ex:
  // digitar 2,1,4,3,2,7 vira 0,02 → 0,21 → 2,14 → 21,43 → 214,32 →
  // 2.143,27). O valor cru (centavos) fica guardado em dataset.digits;
  // beforeinput é interceptado por inteiro pra controlar isso sem depender
  // da posição do cursor.
  function formatPriceFromDigits(digits) {
    if (!digits) return '';
    var value = parseInt(digits, 10) / 100;
    return value.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function setPriceDigits(input, digits) {
    digits = digits.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(-15);
    input.dataset.digits = digits;
    input.value = formatPriceFromDigits(digits);
  }

  function priceInputToNumber(input) {
    var digits = input.dataset.digits || '';
    return digits ? parseInt(digits, 10) / 100 : null;
  }

  function setupPriceMask(input) {
    input.addEventListener('beforeinput', function (e) {
      e.preventDefault();
      var digits = input.dataset.digits || '';
      if (e.inputType === 'deleteContentBackward' || e.inputType === 'deleteContentForward' || e.inputType === 'deleteByCut') {
        digits = digits.slice(0, -1);
      } else if (e.data) {
        digits += e.data.replace(/\D/g, '');
      }
      setPriceDigits(input, digits);
    });
  }

  function fileToDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function api(path, options) {
    var res = await fetch(API_BASE + path, Object.assign({
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
    }, options || {}));
    var data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      throw new Error((data && data.error) || ('Erro ' + res.status));
    }
    return data;
  }

  function hasActiveFilters() {
    return !!(state.search.trim() || state.category || state.material || state.noPrice || state.noPhoto);
  }

  function getFilteredProducts() {
    var term = state.search.trim().toLowerCase();
    var list = state.products.filter(function (product) {
      if (term && !(product.title && product.title.toLowerCase().indexOf(term) !== -1)) return false;
      if (state.category && product.category !== state.category) return false;
      if (state.material && product.material !== state.material) return false;
      if (state.noPrice && product.price != null) return false;
      if (state.noPhoto && product.image) return false;
      return true;
    });

    if (state.sort === 'name') {
      list.sort(function (a, b) { return (a.title || '').localeCompare(b.title || '', 'pt-BR'); });
    } else if (state.sort === 'price-asc') {
      list.sort(function (a, b) {
        return (a.price == null ? Infinity : a.price) - (b.price == null ? Infinity : b.price);
      });
    } else if (state.sort === 'price-desc') {
      list.sort(function (a, b) {
        return (b.price == null ? -Infinity : b.price) - (a.price == null ? -Infinity : a.price);
      });
    }
    return list;
  }

  function renderProducts() {
    grid.innerHTML = '';
    var filtersActive = hasActiveFilters();
    var filtered = getFilteredProducts();

    productCount.textContent = filtersActive
      ? filtered.length + ' de ' + state.products.length + ' produto(s)'
      : state.products.length + ' produto(s)';

    emptyState.hidden = filtered.length > 0;
    emptyState.textContent = filtersActive
      ? 'Nenhum produto encontrado com esses filtros.'
      : 'Nenhum produto cadastrado ainda.';

    filtered.forEach(function (product) {
      var card = document.createElement('div');
      card.className = 'card';

      var thumb = document.createElement('div');
      thumb.className = 'thumb';
      if (product.image) loadThumbImage(thumb, product.image);
      card.appendChild(thumb);

      var body = document.createElement('div');
      body.className = 'body';
      body.innerHTML =
        '<div class="title">' + escapeHtml(product.title) + '</div>' +
        '<div class="meta">' + escapeHtml(categoryLabel(product.category)) + ' · ' + escapeHtml(product.material || '') + '</div>' +
        '<div class="price">' + (product.price != null ? 'R$ ' + Number(product.price).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : 'Sem preço') + '</div>';
      card.appendChild(body);

      var actions = document.createElement('div');
      actions.className = 'actions';

      var editBtn = document.createElement('button');
      editBtn.className = 'btn outline';
      editBtn.textContent = 'Editar';
      editBtn.onclick = function () { openModal(product); };
      actions.appendChild(editBtn);

      var delBtn = document.createElement('button');
      delBtn.className = 'btn danger';
      delBtn.textContent = 'Excluir';
      delBtn.onclick = function () { deleteProduct(product); };
      actions.appendChild(delBtn);

      card.appendChild(actions);
      grid.appendChild(card);
    });
  }

  // A foto pode demorar alguns segundos a mais que o produto pra ficar
  // disponível (commit acabou de sair). Pré-carrega antes de aplicar como
  // background, tentando de novo algumas vezes em vez de mostrar vazio.
  function loadThumbImage(thumb, src, attempt) {
    attempt = attempt || 0;
    var MAX_ATTEMPTS = 5;
    function setNote(text) {
      var note = thumb.querySelector('.thumb-note');
      if (!note) {
        note = document.createElement('span');
        note.className = 'thumb-note';
        thumb.appendChild(note);
      }
      note.textContent = text;
    }
    var probe = new Image();
    probe.onload = function () {
      thumb.style.backgroundImage = 'url(' + probe.src + ')';
      var note = thumb.querySelector('.thumb-note');
      if (note) note.remove();
    };
    probe.onerror = function () {
      if (attempt < MAX_ATTEMPTS) {
        setNote('Carregando foto...');
        setTimeout(function () { loadThumbImage(thumb, src, attempt + 1); }, 1500 * (attempt + 1));
      } else {
        setNote('Foto indisponível');
      }
    };
    probe.src = attempt === 0 ? src : src + (src.indexOf('?') === -1 ? '?' : '&') + 'retry=' + Date.now();
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  async function loadProducts() {
    grid.innerHTML = '<div class="grid-status"><span class="spinner" aria-hidden="true"></span><p>Carregando produtos...</p></div>';
    emptyState.hidden = true;
    try {
      state.products = await api('/api/products');
    } catch (e) {
      grid.innerHTML = '<div class="grid-status"><p>Não foi possível carregar os produtos.</p></div>';
      throw e;
    }
    populateCategoryOptions();
    renderProducts();
  }

  function openModal(product) {
    formError.textContent = '';
    productForm.reset();
    state.editingId = product ? product.id : null;
    modalTitle.textContent = product ? 'Editar produto' : 'Novo produto';

    document.getElementById('f-title').value = product ? product.title : '';
    document.getElementById('f-description').value = product ? product.description || '' : '';
    document.getElementById('f-category').value = product && product.category ? categoryLabel(product.category) : '';
    document.getElementById('f-material').value = product ? product.material || 'Prata 925' : 'Prata 925';
    setPriceDigits(
      document.getElementById('f-price'),
      product && product.price != null ? Math.round(product.price * 100).toString() : ''
    );
    document.getElementById('f-size').value = product && product.size ? product.size : '';
    currentImageHint.textContent = product && product.image ? 'Imagem atual: ' + product.image : '';

    modalOverlay.hidden = false;
  }

  function closeModal() {
    modalOverlay.hidden = true;
    state.editingId = null;
  }

  var confirmOverlay = document.getElementById('confirm-overlay');
  var confirmMessage = document.getElementById('confirm-message');
  var btnConfirmDelete = document.getElementById('btn-confirm-delete');
  var productPendingDelete = null;

  function openDeleteConfirm(product) {
    productPendingDelete = product;
    confirmMessage.textContent = 'Excluir "' + product.title + '"?';
    confirmOverlay.hidden = false;
  }

  function closeDeleteConfirm() {
    confirmOverlay.hidden = true;
    productPendingDelete = null;
    btnConfirmDelete.disabled = false;
  }

  function deleteProduct(product) {
    openDeleteConfirm(product);
  }

  async function confirmDeleteProduct() {
    var product = productPendingDelete;
    if (!product) return;
    btnConfirmDelete.disabled = true;
    try {
      await api('/api/products?id=' + encodeURIComponent(product.id), { method: 'DELETE' });
      closeDeleteConfirm();
      showToast('Produto excluído');
      await loadProducts();
    } catch (err) {
      btnConfirmDelete.disabled = false;
      showToast(err.message, true);
    }
  }

  productForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    formError.textContent = '';
    var saveBtn = document.getElementById('btn-save');
    saveBtn.disabled = true;

    try {
      var categorySlug = slugify(document.getElementById('f-category').value);
      if (!categorySlug) {
        throw new Error('Informe uma categoria válida');
      }

      var payload = {
        product: {
          title: document.getElementById('f-title').value.trim(),
          description: document.getElementById('f-description').value.trim(),
          category: categorySlug,
          material: document.getElementById('f-material').value,
          price: priceInputToNumber(document.getElementById('f-price')),
          size: document.getElementById('f-size').value.trim() || null,
        },
      };

      var fileInput = document.getElementById('f-image');
      if (fileInput.files && fileInput.files[0]) {
        payload.image = await fileToDataUrl(fileInput.files[0]);
      }

      if (state.editingId) {
        await api('/api/products?id=' + encodeURIComponent(state.editingId), {
          method: 'PUT',
          body: JSON.stringify(payload),
        });
        showToast('Produto atualizado');
      } else {
        await api('/api/products', {
          method: 'POST',
          body: JSON.stringify(payload),
        });
        showToast('Produto criado');
      }

      closeModal();
      await loadProducts();
    } catch (err) {
      formError.textContent = err.message;
    } finally {
      saveBtn.disabled = false;
    }
  });

  document.getElementById('btn-new-product').onclick = function () { openModal(null); };
  setupPriceMask(document.getElementById('f-price'));
  searchInput.addEventListener('input', function () {
    state.search = searchInput.value;
    renderProducts();
  });
  filterCategory.addEventListener('change', function () {
    state.category = filterCategory.value;
    renderProducts();
  });
  filterMaterial.addEventListener('change', function () {
    state.material = filterMaterial.value;
    renderProducts();
  });
  filterSort.addEventListener('change', function () {
    state.sort = filterSort.value;
    renderProducts();
  });
  filterNoPrice.addEventListener('change', function () {
    state.noPrice = filterNoPrice.checked;
    renderProducts();
  });
  filterNoPhoto.addEventListener('change', function () {
    state.noPhoto = filterNoPhoto.checked;
    renderProducts();
  });
  btnClearFilters.addEventListener('click', function () {
    state.search = '';
    state.category = '';
    state.material = '';
    state.noPrice = false;
    state.noPhoto = false;
    state.sort = 'recent';
    searchInput.value = '';
    filterCategory.value = '';
    filterMaterial.value = '';
    filterSort.value = 'recent';
    filterNoPrice.checked = false;
    filterNoPhoto.checked = false;
    renderProducts();
  });
  document.getElementById('btn-cancel').onclick = closeModal;
  modalOverlay.addEventListener('click', function (e) {
    if (e.target === modalOverlay) closeModal();
  });

  var categoriesOverlay = document.getElementById('categories-overlay');
  document.getElementById('btn-manage-categories').onclick = function () {
    renderCategoriesManager();
    categoriesOverlay.hidden = false;
  };
  document.getElementById('btn-categories-close').onclick = function () {
    categoriesOverlay.hidden = true;
  };
  categoriesOverlay.addEventListener('click', function (e) {
    if (e.target === categoriesOverlay) categoriesOverlay.hidden = true;
  });

  document.getElementById('btn-confirm-cancel').onclick = closeDeleteConfirm;
  document.getElementById('btn-confirm-delete').onclick = confirmDeleteProduct;
  confirmOverlay.addEventListener('click', function (e) {
    if (e.target === confirmOverlay) closeDeleteConfirm();
  });

  var logoutBtn = document.getElementById('btn-logout');
  var logoutSpinner = document.getElementById('logout-spinner');
  var logoutBtnLabel = document.getElementById('logout-btn-label');

  logoutBtn.onclick = async function () {
    logoutBtn.disabled = true;
    logoutSpinner.hidden = false;
    logoutBtnLabel.textContent = 'Saindo...';
    try {
      await api('/api/logout', { method: 'POST' });
    } finally {
      showLogin();
    }
  };

  var loginBtn = document.getElementById('btn-login');
  var loginSpinner = document.getElementById('login-spinner');
  var loginBtnLabel = document.getElementById('login-btn-label');

  loginForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    loginError.textContent = '';
    loginBtn.disabled = true;
    loginSpinner.hidden = false;
    loginBtnLabel.textContent = 'Entrando...';
    try {
      await api('/api/login', {
        method: 'POST',
        body: JSON.stringify({ password: document.getElementById('login-password').value }),
      });
      await showApp();
    } catch (err) {
      loginError.textContent = err.message;
      loginBtn.disabled = false;
      loginSpinner.hidden = true;
      loginBtnLabel.textContent = 'Entrar';
    }
  });

  function showLogin() {
    bootView.hidden = true;
    appView.hidden = true;
    loginView.hidden = false;
    document.getElementById('login-password').value = '';
    loginBtn.disabled = false;
    loginSpinner.hidden = true;
    loginBtnLabel.textContent = 'Entrar';
    logoutBtn.disabled = false;
    logoutSpinner.hidden = true;
    logoutBtnLabel.textContent = 'Sair';
  }

  async function showApp() {
    bootView.hidden = true;
    loginView.hidden = true;
    appView.hidden = false;
    await loadProducts();
  }

  (async function init() {
    try {
      var session = await api('/api/session');
      if (session.authenticated) {
        await showApp();
        return;
      }
    } catch (e) {}
    showLogin();
  })();
})();
</script>
</body>
</html>
